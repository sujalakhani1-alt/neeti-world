
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little World of Neetiii ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <div class="moon">🌙</div>

    <p class="eyebrow">A LITTLE SOMETHING FOR YOU</p>

    <h1>A Little World<br>of <span>Neetiii</span> 💗</h1>

    <p class="subtitle">
      Even miles apart, you make my world brighter.
    </p>

    <div class="heart">♡</div>

    <section class="buttons">
      <button onclick="openLetter()">💌 Open my letter</button>
      <button onclick="discoverReason()">❤️ Discover a reason</button>
      <button onclick="tapStar()">✨ Make a wish</button>
      <button onclick="showCountdown()">⏳ Days to See You</button>
      <button onclick="showSongPlayer()">🎶 Song Dedicated to You</button>
      <button onclick="window.location.href='quiz.html'">
  🎮 How Well Do You Know Me?
</button>
      
<button onclick="window.location.href='album.html'">
  📸 Your Cute Little Album
</button>
      
<button onclick="window.location.href='lastly.html'">
  Lastly..... 💗
</button>


    </section>

    <div id="countdown" class="countdown" hidden></div>

    <div id="songPlayer" class="song-player" hidden>
      <div class="music-note">🎵</div>
      <h2>A Little Melody For You 💗</h2>
      <p>Goguuuu, aa song specially tara mate! 🥹❤️</p>

      <div class="music-controls">
        <button onclick="playSong()">▶ Play</button>
        <button onclick="pauseSong()">⏸ Pause</button>
      </div>

      <p id="songStatus">Tap Play to listen 💕</p>
    </div>

    <div id="message" class="message">
      Your little surprise will appear here. 💕
    </div>

    <p class="footer">Made with a little extra love ♡</p>
  </main>

  <audio id="dedicatedSong" preload="none">
    <source src="oursong.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
