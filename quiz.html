
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>How Well Do You Know Me? ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 25px 15px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Georgia, serif;
  color: white;
  background: linear-gradient(
    145deg,
    #160d25,
    #54243e,
    #29142e
  );
}

.quiz-card {
  width: 100%;
  max-width: 480px;
  padding: 30px 22px;
  text-align: center;
  background: rgba(30, 12, 38, 0.8);
  border: 1px solid rgba(255, 192, 223, 0.4);
  border-radius: 26px;
  box-shadow: 0 15px 50px rgba(0,0,0,0.3);
}

h1 {
  font-size: clamp(29px, 8vw, 39px);
  line-height: 1.25;
  font-weight: normal;
  color: #ffd0e7;
}

h2 {
  font-size: 23px;
  line-height: 1.5;
  font-weight: normal;
  color: #ffe0ee;
}

.subtitle {
  color: #f5d1e2;
  line-height: 1.8;
}

.heart {
  font-size: 45px;
  margin: 18px 0;
  animation: heartbeat 1.5s infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}

.question-count {
  color: #ffbadb;
  font: 12px Arial, sans-serif;
  letter-spacing: 2px;
}

.progress {
  width: 100%;
  height: 8px;
  margin: 22px 0;
  background: rgba(255,255,255,0.15);
  border-radius: 20px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #ff9bc9;
  transition: width 0.35s;
}

.option {
  width: 100%;
  padding: 16px;
  margin: 10px 0;
  border: 1px solid #c88aac;
  border-radius: 17px;
  background: rgba(255,255,255,0.07);
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.25s;
}

.option:hover {
  background: rgba(255,155,201,0.22);
}

.option.selected {
  background: rgba(255,155,201,0.4);
  border: 2px solid #ffd0e7;
}

.option:disabled {
  cursor: default;
}

.main-btn {
  margin-top: 18px;
  padding: 15px 25px;
  border: none;
  border-radius: 30px;
  background: #f7a5cc;
  color: #30152d;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.main-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.feedback {
  min-height: 30px;
  color: #ffd4e6;
  line-height: 1.6;
}

.score {
  font-size: 60px;
  color: #ffb5d6;
  margin: 20px 0;
}

.hidden {
  display: none !important;
}

.back-link {
  display: inline-block;
  margin-top: 28px;
  color: #ffd0e7;
  text-decoration: none;
  font-size: 14px;
}

.sparkle {
  position: fixed;
  pointer-events: none;
  z-index: 100;
  animation: floatUp 3s ease-out forwards;
}

@keyframes floatUp {
  0% {
    opacity: 1;
    transform: translateY(0) scale(0.5);
  }
  100% {
    opacity: 0;
    transform: translateY(-180px) scale(1.5);
  }
}

@media (max-width: 480px) {
  .quiz-card {
    padding: 25px 17px;
  }
}
</style>
</head>

<body>

<main class="quiz-card">

  <h1>How Well Do You Know Me? 🎀</h1>

  <p class="subtitle">
    Goguuuu, let's see how much you really know
    about me! 🤭❤️
  </p>

  <div class="heart">💗</div>

  <!-- START SCREEN -->

  <section id="intro">
    <p class="subtitle">
      5 little questions, a little teasing,
      and a surprise waiting at the end! 🥹💕
    </p>

    <button class="main-btn" onclick="startQuiz()">
      Start the Challenge 💕
    </button>
  </section>

  <!-- QUESTIONS -->

  <section id="quiz" class="hidden">

    <p id="questionCount" class="question-count"></p>

    <div class="progress">
      <div id="progressFill" class="progress-fill"></div>
    </div>

    <h2 id="questionText"></h2>

    <div id="answers"></div>

    <p id="feedback" class="feedback"></p>

    <button
      id="nextButton"
      class="main-btn"
      onclick="nextQuestion()"
      disabled
    >
      Next Question 💗
    </button>

  </section>

  <!-- FINAL RESULTS -->

  <section id="results" class="hidden">

    <h2>Quiz Complete! 🥹❤️</h2>

    <div id="finalScore" class="score"></div>

    <p id="resultMessage" class="subtitle"></p>

    <button class="main-btn" onclick="restartQuiz()">
      Play Again 🔁
    </button>

  </section>

  <a href="index.html" class="back-link">
    ← Back to Neetiii's World 🌙
  </a>

</main>

<script>

/* YOUR FIVE PERSONALIZED QUESTIONS */

const questions = [

  {
    question: "What is the most fav thing I liked about you? 🥹",
    options: [
      "You❤️",
      "Tu❤️",
      "You only❤️",
      "khaliii n khaliii tu❤️"
    ],
    correct: 3,
    reaction: "Yessss! Khaliii n khaliii tuuu! 🥹❤️"
  },

  {
    question: "What's my favourite thing to call you? 🤭",
    options: [
      "Neetiii",
      "Goguuuu",
      "Cutuuu",
      "Betuuu"
    ],
    correct: 3,
    reaction: "Betuuuuuu! Hehehe, you know me! 😭💗"
  },

  {
    question: "If we could teleport anywhere right now, where would we will go? ✨",
    options: [
      "switzerland...",
      "ahmedabad....",
      "aapda lagan ma",
      "las vegass"
    ],
    correct: 2,
    reaction: "Aapda lagan maaaaa! 😭❤️💍"
  },

  {
    question: "What do I do when I miss you? 🌙",
    options: [
      "Listen to music 🎶",
      "Look at your photos 💬",
      "Wait for your message 🥹",
      "All of these 💗"
    ],
    correct: 1,
    reaction: "Tara photos jovu ne smile karvu! 🥹💕"
  },

  {
    question: "What's one thing I want to do when we finally meet? ❤️",
    options: [
      "Badhu j 🤭",
      "Give you a big hug 🫂",
      "Take cute pictures 📸",
      "Spend the whole day together 💕"
    ],
    correct: 0,
    reaction: "Badhuuu j! Ek pan moment waste nai karvi! 😭❤️"
  }

];

let currentQuestion = 0;
let score = 0;
let answered = false;

function startQuiz() {
  currentQuestion = 0;
  score = 0;

  document.getElementById("intro").classList.add("hidden");
  document.getElementById("results").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");

  showQuestion();
}

function showQuestion() {
  answered = false;

  const q = questions[currentQuestion];

  document.getElementById("questionCount").textContent =
    `QUESTION ${currentQuestion + 1} OF ${questions.length}`;

  document.getElementById("progressFill").style.width =
    `${((currentQuestion + 1) / questions.length) * 100}%`;

  document.getElementById("questionText").textContent =
    q.question;

  document.getElementById("feedback").textContent = "";

  const next = document.getElementById("nextButton");

  next.disabled = true;

  next.textContent =
    currentQuestion === questions.length - 1
      ? "See My Results 💕"
      : "Next Question 💗";

  const answers = document.getElementById("answers");

  answers.innerHTML = "";

  q.options.forEach((option, index) => {

    const button = document.createElement("button");

    button.className = "option";
    button.textContent = option;

    button.onclick = () => selectAnswer(index);

    answers.appendChild(button);

  });
}

function selectAnswer(index) {
  if (answered) return;

  answered = true;

  const q = questions[currentQuestion];

  const buttons = document.querySelectorAll(".option");

  buttons.forEach(button => button.disabled = true);

  buttons[index].classList.add("selected");

  if (index === q.correct) {

    score++;

    document.getElementById("feedback").textContent =
      q.reaction;

    launchHearts();

  } else {

    document.getElementById("feedback").textContent =
      "Awww Betuuu, aa answer khoto che! 😭💗";

  }

  document.getElementById("nextButton").disabled = false;
}

function nextQuestion() {

  currentQuestion++;

  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    showResults();
  }

}

function showResults() {

  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("results").classList.remove("hidden");

  document.getElementById("finalScore").textContent =
    `${score} / ${questions.length}`;

  let message = "";

  if (score === 5) {

    message =
      "5/5?! Betuuuu, you know me better than anyone! 🥹❤️ " +
      "But you know what? You already won my heart " +
      "long before this quiz. 💗";

    launchHearts();

  } else if (score >= 3) {

    message =
      "Hehehe Betuuu! 🤭💕 " +
      "You know quite a lot about me. " +
      "But I still have so many little things to tell you! ❤️";

  } else {

    message =
      "Areee Betuuu! 😭❤️ " +
      "Looks like we need more late-night conversations! " +
      "But don't worry, you're still my favourite person. 💗";

  }

  document.getElementById("resultMessage").textContent =
    message;

}

function restartQuiz() {
  startQuiz();
}

/* FLOATING HEARTS */

function launchHearts() {

  const hearts = ["❤️", "💗", "💕", "💖", "✨"];

  for (let i = 0; i < 35; i++) {

    const heart = document.createElement("span");

    heart.className = "sparkle";

    heart.textContent =
      hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.top = (65 + Math.random() * 30) + "vh";
    heart.style.fontSize = (15 + Math.random() * 20) + "px";
    heart.style.animationDelay = Math.random() * 0.8 + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 4000);

  }

}

</script>

</body>
</html>
