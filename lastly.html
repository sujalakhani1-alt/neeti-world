
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lastly..... 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(
        145deg,
        #ffe6f0,
        #f8c8dc,
        #fff1f6
      );
      font-family: Georgia, serif;
      color: #8c4167;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 35px 18px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 580px;
      text-align: center;
      position: relative;
      z-index: 2;
      animation: appear 1.5s ease both;
    }

    h1 {
      font-size: clamp(30px, 7vw, 44px);
      font-weight: normal;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 17px;
      margin-bottom: 30px;
    }

    /* SPECIAL PHOTO */

    .photo-frame {
      background: white;
      padding: 13px 13px 35px;
      box-shadow:
        0 15px 35px rgba(150, 60, 100, 0.25);
      transform: rotate(-3deg);
      margin: 0 auto 40px;
      max-width: 380px;
      animation: float 5s ease-in-out infinite;
    }

    .photo-frame img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 3px;
    }

    /* YOUR MESSAGE */

    .message {
      background: rgba(255, 255, 255, 0.8);
      padding: 30px 24px;
      border-radius: 22px;
      box-shadow:
        0 10px 30px rgba(160, 80, 120, 0.12);
      font-size: clamp(17px, 4.5vw, 21px);
      line-height: 1.9;
    }

    .message p {
      margin: 0;
    }

    .signature {
      margin-top: 22px;
      font-size: 30px;
      color: #d65d98;
    }

    /* BACK BUTTON */

    .back-btn {
      display: inline-block;
      margin-top: 35px;
      padding: 14px 25px;
      background: white;
      border-radius: 30px;
      color: #a64b7c;
      text-decoration: none;
      box-shadow:
        0 5px 15px rgba(115, 49, 84, 0.12);
      transition: transform 0.3s;
    }

    .back-btn:hover {
      transform: translateY(-4px);
    }

    /* FLOATING HEARTS */

    .heart {
      position: fixed;
      bottom: -40px;
      pointer-events: none;
      animation: rise linear infinite;
      opacity: 0.5;
      z-index: 1;
    }

    @keyframes rise {
      from {
        transform: translateY(0);
        opacity: 0;
      }

      20% {
        opacity: 0.5;
      }

      to {
        transform: translateY(-115vh);
        opacity: 0;
      }
    }

    /* PAGE ANIMATION */

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(35px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* FLOATING PHOTO */

    @keyframes float {
      0%, 100% {
        transform: rotate(-3deg) translateY(0);
      }

      50% {
        transform: rotate(-2deg) translateY(-10px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .container,
      .photo-frame,
      .heart {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Lastly..... 💗</h1>

    <p class="subtitle">
      One last little thing, Betuuu 🥹
    </p>

    <!-- YOUR SPECIAL PHOTO -->

    <div class="photo-frame">

      <img
        src="lastphoto.PNG"
        alt="Our special memory"
      >

    </div>

    <!-- YOUR SPECIAL MESSAGE -->

    <div class="message">

      <p>
        It all starts from here, Betu. 🥹❤️

        <br><br>

        Thanks for having me in your life.

        <br><br>

        Tu mari smile nu reason chu ek
        these days. 💗

        <br><br>

        Raah jou chu to see you in person.

        <br><br>

        Lots of love and a cute hug
        to you, Betu. 🫂❤️
      </p>

      <div class="signature">
        ♡
      </div>

    </div>

    <!-- RETURN TO HOME -->

    <a href="index.html" class="back-btn">
      ← Back to Neetiii's World 💗
    </a>

  </main>

  <script>

    const symbols = ["💗", "💕", "♡", "✨"];

    for (let i = 0; i < 20; i++) {

      const heart = document.createElement("span");

      heart.className = "heart";

      heart.textContent =
        symbols[
          Math.floor(Math.random() * symbols.length)
        ];

      heart.style.left =
        Math.random() * 100 + "%";

      heart.style.fontSize =
        (15 + Math.random() * 18) + "px";

      heart.style.animationDuration =
        (8 + Math.random() * 8) + "s";

      heart.style.animationDelay =
        -(Math.random() * 12) + "s";

      document.body.appendChild(heart);

    }

  </script>

</body>
</html>
